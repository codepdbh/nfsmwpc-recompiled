name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      generated_sources_url:
        description: "HTTPS URL to a ZIP containing src/recomp/gen, gen_server, gen_d3dx and gen_abk"
        required: true
        type: string
      abi:
        description: "Android ABI to build"
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
        default: arm64-v8a

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ inputs.abi == 'both' && fromJSON('["arm64-v8a", "armeabi-v7a"]') || fromJSON(format('["{0}"]', inputs.abi)) }}

    steps:
      - name: Checkout Most Wanted
        uses: actions/checkout@v4
        with:
          path: nfsmw

      - name: Checkout pcrecomp
        uses: actions/checkout@v4
        with:
          repository: codepdbh/pcrecomp
          path: pcrecomp

      - name: Checkout shared NFSU2 Android infrastructure
        uses: actions/checkout@v4
        with:
          repository: codepdbh/nfsu2-recompiled
          path: nfsu2-recompiled

      - name: Download generated game sources
        env:
          SOURCES_URL: ${{ inputs.generated_sources_url }}
          SOURCES_TOKEN: ${{ secrets.ANDROID_BUILD_INPUTS_TOKEN }}
        run: |
          set -euo pipefail
          case "$SOURCES_URL" in
            https://*) ;;
            *) echo "::error::generated_sources_url must use HTTPS"; exit 1 ;;
          esac
          if [ -n "${SOURCES_TOKEN:-}" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $SOURCES_TOKEN" \
              "$SOURCES_URL" -o generated-sources.zip
          else
            curl --fail --location --retry 3 --retry-delay 2 \
              "$SOURCES_URL" -o generated-sources.zip
          fi
          unzip -q generated-sources.zip -d generated-sources
          for dir in gen gen_server gen_d3dx gen_abk; do
            if [ ! -d "generated-sources/src/recomp/$dir" ]; then
              echo "::error::Archive is missing src/recomp/$dir"
              exit 1
            fi
          done
          mkdir -p nfsmw/src/recomp
          cp -a generated-sources/src/recomp/gen nfsmw/src/recomp/
          cp -a generated-sources/src/recomp/gen_server nfsmw/src/recomp/
          cp -a generated-sources/src/recomp/gen_d3dx nfsmw/src/recomp/
          cp -a generated-sources/src/recomp/gen_abk nfsmw/src/recomp/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchains
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.30.5"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify native build prerequisites
        working-directory: nfsmw
        run: |
          set -euo pipefail
          test -f ../pcrecomp/runtime/recomp32/recomp.h || {
            echo "::error::The checked-out pcrecomp tree does not contain runtime/recomp32/recomp.h"
            exit 1
          }
          test -d ../nfsu2-recompiled/build/dxvk-source || {
            echo "::error::nfsu2-recompiled/build/dxvk-source is missing. The shared DXVK Android source must be prepared before this build."
            exit 1
          }
          test -d ../nfsu2-recompiled/ports/dxvk_android
          test -d ../nfsu2-recompiled/third_party/libadrenotools

      - name: Build APK
        working-directory: nfsmw/android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace \
            -PnfsAbi="${{ matrix.abi }}" \
            :app:assembleDebug

      - name: Stage APK
        working-directory: nfsmw/android
        run: |
          set -euo pipefail
          mkdir -p "../../dist"
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "../../dist/NFSMWPC-AndroidEvolved-${{ matrix.abi }}-debug.apk" \;
          test -s "../../dist/NFSMWPC-AndroidEvolved-${{ matrix.abi }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMWPC-AndroidEvolved-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
